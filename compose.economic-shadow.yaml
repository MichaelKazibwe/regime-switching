services:
  economic-shadow:
    image: ${ECONOMIC_SHADOW_IMAGE:?Set a qualified immutable image digest}
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2
    network_mode: "none"
    volumes:
      - ./var:/app/var
      - ./output:/app/output
    tmpfs:
      - /tmp:size=512m,mode=1777
    restart: "no"
