name: Invited pilot backend and image
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: invited-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.hashed.lock
      - name: Backend, auth, isolation, benchmark and financial regressions
        run: python -m pytest -q --junitxml=var/ci/pilot-regression.xml
      - name: Source and frontend lint
        run: |
          python -m ruff check pilot_*.py cycle_benchmark.py performance_*.py execute_performance_improvements.py run_performance_improvements.py test_pilot.py test_cycle_benchmark.py test_performance_improvements.py
          node --check pilot/login.js
          node --check pilot/benchmark.js
      - name: Stage source only; no private market or account data
        run: python pilot_release.py --source-only --destination var/pilot-context
      - name: Build candidate image
        run: docker build --pull -f var/pilot-context/image/Dockerfile.pilot -t regime-pilot:${{ github.sha }} var/pilot-context/image
      - name: Verify image imports and immutable source identity
        run: |
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint python regime-pilot:${{ github.sha }} -c 'from pilot_release import verify_context; from pathlib import Path; verify_context(Path("/app")); import pilot_server,pilot_auth,pilot_collect,pilot_preflight,forward_cohort,managed_api,recommendation_api,cycle_benchmark'
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges regime-pilot:${{ github.sha }} --help
      - name: Evidence directory
        run: mkdir -p security-reports
      - name: Image vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: regime-pilot:${{ github.sha }}
          scanners: vuln
          format: sarif
          output: security-reports/pilot-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: regime-pilot:${{ github.sha }}
          format: cyclonedx
          output: security-reports/pilot-image.cdx.json
          exit-code: '0'
      - name: Bind build evidence
        if: always()
        run: |
          cp var/pilot-context/image/pilot-release.json security-reports/pilot-release.json
          docker image inspect regime-pilot:${{ github.sha }} --format '{{.Id}}' > security-reports/image-id.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: invited-pilot-${{ github.run_id }}
          path: |
            security-reports/
            var/ci/pilot-regression.xml
          retention-days: 30
