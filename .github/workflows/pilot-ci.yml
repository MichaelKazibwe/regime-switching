name: Invited pilot backend and image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      generate_sbom:
        description: Explicitly authorize optional SBOM generation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: invited-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.hashed.lock -r requirements-browser.hashed.lock -r requirements-ops.hashed.lock
      - name: Backend, auth, isolation, benchmark and financial regressions
        run: python -m pytest -q --junitxml=var/ci/pilot-regression.xml
      - name: Source and frontend lint
        run: |
          python -m ruff check .
          node --check pilot/login.js
          node --check pilot/benchmark.js
          node --check pilot/workspace.js
          node --check pilot/weekly.js
          node --check pilot/macro-monitor.js
          node --check dashboard/investor.js
      - name: Stage source only; no private market or account data
        run: python pilot_release.py --source-only --destination var/pilot-context
      - name: Build candidate image
        run: docker build --pull -f var/pilot-context/image/Dockerfile.pilot -t regime-pilot:${{ github.sha }} var/pilot-context/image
      - name: Verify image imports and immutable source identity
        run: |
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint python regime-pilot:${{ github.sha }} -c 'from pilot_release import verify_context; from pathlib import Path; verify_context(Path("/app")); import pilot_server,pilot_auth,pilot_collect,pilot_preflight,forward_cohort,managed_api,recommendation_api,cycle_benchmark,live_observation_cycle,market_quality,run_return_engine_cycle'
          docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges regime-pilot:${{ github.sha }} --help
      - name: Synthetic sealed browser fixture (no real market or account data)
        run: python build_ci_fixture.py --output var/ci/synthetic
      - name: Build exact-image browser runner
        run: docker build --build-arg PILOT_BASE_IMAGE=regime-pilot:${{ github.sha }} -f Dockerfile.pilot-qa -t regime-pilot-qa:${{ github.sha }} .
      - name: Chromium and WebKit exact application image acceptance
        run: |
          python deploy/pilot/image-acceptance.py --app-image regime-pilot:${{ github.sha }} --browser-image regime-pilot-qa:${{ github.sha }} --fixture var/ci/synthetic --output var/ci/browser
      - name: Critical contract branch coverage
        run: |
          python -m coverage run --branch --source=global_market_panel,macro_alpha,pilot_readiness,portfolio_exposures,review_workflow -m pytest -q test_global_market_panel.py test_macro_alpha.py test_pilot_daily.py test_review_assurance.py
          python -m coverage json -o var/ci/critical-coverage.json
          python -m coverage report
      - name: Evidence directory
        run: mkdir -p security-reports
      - name: Image vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          scan-type: image
          image-ref: regime-pilot:${{ github.sha }}
          scanners: vuln
          format: sarif
          limit-severities-for-sarif: true
          output: security-reports/pilot-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: SBOM
        if: github.event_name == 'workflow_dispatch' && inputs.generate_sbom == true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          scan-type: image
          image-ref: regime-pilot:${{ github.sha }}
          format: cyclonedx
          output: security-reports/pilot-image.cdx.json
          exit-code: '0'
      - name: Bind build evidence
        if: always()
        run: |
          mkdir -p security-reports
          if [ -f var/pilot-context/image/pilot-release.json ]; then cp var/pilot-context/image/pilot-release.json security-reports/pilot-release.json; fi
          if docker image inspect regime-pilot:${{ github.sha }} > /dev/null 2>&1; then docker image inspect regime-pilot:${{ github.sha }} --format '{{.Id}}' > security-reports/image-id.txt; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: invited-pilot-${{ github.run_id }}
          path: |
            security-reports/
            var/ci/pilot-regression.xml
            var/ci/critical-coverage.json
            var/ci/browser/
          retention-days: 30
