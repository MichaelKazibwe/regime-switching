name: Recommendation product image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      generate_sbom:
        description: Explicitly authorize optional SBOM generation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: recommendation-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked checks
        run: python -m pip install --require-hashes -r requirements-dev.hashed.lock
      - name: Product regression
        run: python -m pytest -q test_investment_product.py test_product_api_replay.py test_product_state.py test_product_build.py
      - name: Stage minimal reviewed source
        run: python product_build.py --destination var/recommendation-context
      - name: Build exact image
        run: docker build --pull -f var/recommendation-context/Dockerfile.recommendations -t regime-recommendations:${{ github.sha }} var/recommendation-context
      - name: Verify source identity, imports and CLI
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python regime-recommendations:${{ github.sha }} -c 'import json,pathlib; from paper_release import verify; verify(pathlib.Path("/app"),json.loads(pathlib.Path("release-manifest.json").read_text())); import recommendation_api, investment_product, productstate'
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges regime-recommendations:${{ github.sha }} --help
      - name: Synthetic plan, viewer and exact replay smoke
        run: docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --entrypoint python regime-recommendations:${{ github.sha }} product_smoke.py --output /tmp/product-smoke
      - name: Create evidence directory
        run: mkdir -p security-reports
      - name: Scan recommendation image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          scan-type: image
          image-ref: regime-recommendations:${{ github.sha }}
          scanners: vuln
          format: sarif
          output: security-reports/recommendation-image.sarif
          exit-code: '1'
          severity: CRITICAL,HIGH
      - name: Generate image SBOM
        if: github.event_name == 'workflow_dispatch' && inputs.generate_sbom == true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          scan-type: image
          image-ref: regime-recommendations:${{ github.sha }}
          scanners: vuln
          format: cyclonedx
          output: security-reports/recommendation-image.cdx.json
          exit-code: '0'
      - name: Retain image and source identity
        if: always()
        run: |
          mkdir -p security-reports
          cp var/recommendation-context/release-manifest.json security-reports/release-manifest.json
          docker image inspect regime-recommendations:${{ github.sha }} --format '{{.Id}}' > security-reports/image-digest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: recommendation-image-${{ github.run_id }}
          path: security-reports/
          retention-days: 90
