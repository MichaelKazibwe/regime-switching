name: Managed paper candidate checks
on:
  pull_request:
  workflow_dispatch:
    inputs:
      generate_sbom:
        description: Explicitly authorize optional SBOM generation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - run: python -m pip install --require-hashes -r requirements-dev.hashed.lock
      - run: python managed_release.py stage --destination var/managed-ci/source
      - run: python -m pytest -q --junitxml=var/managed-ci/tests.xml
      - run: ruff check .
      - run: docker build -f var/managed-ci/source/Dockerfile.managed-paper -t managed-paper:candidate var/managed-ci/source
      - run: docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges managed-paper:candidate
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          image-ref: managed-paper:candidate
          format: sarif
          output: var/managed-ci/image-scan.sarif
          exit-code: '1'
          severity: CRITICAL,HIGH
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        if: github.event_name == 'workflow_dispatch' && inputs.generate_sbom == true
        with:
          version: v0.76.2
          image-ref: managed-paper:candidate
          format: cyclonedx
          output: var/managed-ci/sbom.json
      - run: docker image inspect managed-paper:candidate --format '{{.Id}}' > var/managed-ci/image-id.txt
      - run: docker save -o var/managed-ci/image.tar managed-paper:candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: managed-paper-evidence
          path: var/managed-ci/
          retention-days: 30
