name: Paper deployment checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
    inputs:
      generate_sbom:
        description: Explicitly authorize optional SBOM generation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: paper-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.12 quality, tests, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked project checks
        run: python -m pip install --require-hashes --requirement requirements-dev.hashed.lock

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Run paper execution proof matrix
        run: python e2e_proof_runner.py

      - name: Audit locked Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-paper.lock requirements-dev.lock
          vulnerability-service: osv

      - name: Retain test and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-check-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            e2e_proof_results.md
            e2e_proof_results.csv
            e2e_proof_results.json
            e2e_execution_evidence.json

  source-security:
    name: Source secret and misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Create report directory
        run: mkdir -p security-reports

      - name: Scan source and deployment configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          format: json
          output: security-reports/source-scan.json
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Retain source scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-source-security-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: security-reports/source-scan.json

  container:
    name: Build, scan, and inventory paper image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build paper worker image
        run: |
          python paper_release.py stage --destination var/release-context
          docker build --pull --build-arg PAPER_CODE_REVISION=${{ github.sha }} --tag regime-switching-paper:${{ github.sha }} var/release-context

      - name: Check imports inside the exact image
        run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges regime-switching-paper:${{ github.sha }} python -c 'import paper_service, paper_admin, paper_backup, paper_qualification, macrovintage, paper_dashboard_server, monthlyreport, monthlydelivery, reportlab'

      - name: Create report directory
        run: mkdir -p security-reports

      - name: Scan paper image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: regime-switching-paper:${{ github.sha }}
          scanners: vuln
          format: sarif
          limit-severities-for-sarif: true
          output: security-reports/image-vulnerabilities.sarif
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Generate image SBOM
        if: github.event_name == 'workflow_dispatch' && inputs.generate_sbom == true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: regime-switching-paper:${{ github.sha }}
          scanners: vuln
          format: cyclonedx
          output: security-reports/paper-image.cdx.json
          exit-code: "0"

      - name: Record image identity
        run: |
          docker image inspect regime-switching-paper:${{ github.sha }} \
            --format '{{.Id}}' > security-reports/image-digest.txt
          cp var/release-context/release-manifest.json security-reports/release-manifest.json

      - name: Export the scanned image for deployment
        run: |
          docker save regime-switching-paper:${{ github.sha }} | gzip > security-reports/paper-image.tar.gz
          cd security-reports
          sha256sum paper-image.tar.gz > paper-image.tar.gz.sha256

      - name: Retain image security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-image-security-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 90
          path: security-reports/
