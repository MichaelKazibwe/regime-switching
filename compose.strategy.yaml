services:
  validation:
    image: ${STRATEGY_IMAGE:?Set a reviewed immutable image digest}
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 4g
    cpus: 2
    env_file:
      - ${STRATEGY_SECRET_FILE:-/etc/regime/strategy.env}
    volumes:
      - ./var:/app/var
      - ./output:/app/output
    tmpfs:
      - /tmp:size=512m,mode=1777
    command: ["--root", "/app/var/live-observation-cycle", "--operations", "/app/var/strategy-operations-integrated-v1"]
    restart: "no"
